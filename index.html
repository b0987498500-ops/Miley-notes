<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <title>麥麥筆記 | 教學影片重點精華庫</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- KaTeX for High Performance Math Formula Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Project Stylesheet with Cache Buster -->
  <link rel="stylesheet" href="styles.css?v=1.2.0">
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <nav class="top-nav">
    <div class="brand-section">
      <div class="logo-badge">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <div class="brand-text">
        <h1>麥麥筆記 <span style="font-size: 0.9rem; font-weight: 700; opacity: 0.85; color: var(--primary);">Miley Notes</span></h1>
        <p>教學影片重點精華庫 · 純淨免抄寫系統</p>
      </div>
    </div>

    <div class="top-controls">
      <!-- Font Size Controller: 超有感字體放大器 -->
      <div class="font-control-group" title="字體大小調節">
        <button id="btn-font-dec" class="font-btn" aria-label="縮小字體">A-</button>
        <span id="font-scale-label" class="font-scale-display">100%</span>
        <button id="btn-font-inc" class="font-btn" aria-label="放大字體">A+</button>
      </div>

      <!-- Theme Selector -->
      <div class="theme-selector" title="外觀主題切換">
        <button class="theme-btn active" data-theme="light" title="清新亮色"><i class="fa-solid fa-sun"></i></button>
        <button class="theme-btn" data-theme="eyecare" title="溫和護眼"><i class="fa-solid fa-feather-pointed"></i></button>
        <button class="theme-btn" data-theme="dark" title="沉浸深色"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="main-container">
    <!-- Hero & Search Section -->
    <header class="hero-banner">
      <h2>隨看隨記 · 智能筆記精華</h2>
      <p>觀看教學影片截圖傳送，AI 自動提煉觀念、翻牌背誦大表與口訣，免抄寫無負擔！</p>
      
      <div class="search-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="search-input" class="search-input" placeholder="搜尋核心觀念、口訣、動物、植物或章節關鍵字..." autocomplete="off">
      </div>
    </header>

    <!-- Subject Tabs -->
    <div class="tabs-scroll-container">
      <div class="subject-tabs">
        <button class="subject-tab-btn active" data-subject="all">
          <i class="fa-solid fa-layer-group"></i> 全部重點
          <span class="badge-count">3</span>
        </button>
        <button class="subject-tab-btn" data-subject="science">
          <i class="fa-solid fa-flask"></i> 自然
          <span class="badge-count">3</span>
        </button>
        <button class="subject-tab-btn" data-subject="math">
          <i class="fa-solid fa-calculator"></i> 數學
          <span class="badge-count">0</span>
        </button>
        <button class="subject-tab-btn" data-subject="chinese">
          <i class="fa-solid fa-book-open"></i> 國文
          <span class="badge-count">0</span>
        </button>
        <button class="subject-tab-btn" data-subject="social">
          <i class="fa-solid fa-globe-asia"></i> 社會
          <span class="badge-count">0</span>
        </button>
        <button class="subject-tab-btn" data-subject="english">
          <i class="fa-solid fa-language"></i> 英文
          <span class="badge-count">0</span>
        </button>
      </div>
    </div>

    <!-- Stats Ribbon -->
    <div class="stats-bar">
      <div class="stats-left">
        <span id="stats-label"><i class="fa-solid fa-bookmark"></i> 目前顯示 <b>3</b> 則重點筆記</span>
        <span class="stats-tip"><i class="fa-solid fa-wand-magic-sparkles"></i> 支援翻牌背誦測試</span>
      </div>
      <div class="stats-right">
        <!-- 閱讀模式切換：預設精裝翻書模式 -->
        <div class="view-mode-toggle" title="切換閱讀版面模式">
          <button class="mode-btn active" id="btn-mode-book" data-mode="book">
            <i class="fa-solid fa-book-open"></i> 翻書模式
          </button>
          <button class="mode-btn" id="btn-mode-list" data-mode="list">
            <i class="fa-solid fa-list-ul"></i> 清單模式
          </button>
        </div>
      </div>
    </div>

    <!-- Dynamic Notes Container (Book Mode / List Mode) -->
    <section id="notes-container" class="notes-content-area">
      <!-- Injected by app.js -->
    </section>
  </main>

  <!-- High Definition Image Lightbox Modal -->
  <div id="image-lightbox" class="image-lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-dialog" onclick="event.stopPropagation()">
      <button class="lightbox-close-btn" onclick="closeLightbox()" title="關閉放大視窗 (Esc)">&times;</button>
      <img id="lightbox-img" src="" alt="教學重點高清大圖">
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>

  <!-- Scripts with Cache Buster -->
  <script src="notes_data.js?v=1.2.0"></script>
  <script src="app.js?v=1.2.0"></script>
</body>
</html>
