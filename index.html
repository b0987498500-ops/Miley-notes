<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <title>麥麥筆記 | 教學影片重點精華庫</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- KaTeX for High Performance Math Formula Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Canvas Confetti for Celebration Effects -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Project Stylesheet with Cache Buster -->
  <link rel="stylesheet" href="styles.css?v=2.3.0">
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <nav class="top-nav">
    <div class="brand-section">
      <div class="logo-badge">
        <img src="images/illustrations/miley_brand_logo.png" alt="麥麥筆記" class="brand-logo-img">
      </div>
      <div class="brand-text">
        <h1>麥麥筆記 <span style="font-size: 0.9rem; font-weight: 700; opacity: 0.85; color: var(--primary);">Miley Notes</span></h1>
        <p>教學影片重點精華庫 · 純淨免抄寫系統</p>
      </div>
    </div>

    <div class="top-controls">
      <!-- Cross-Link: 麥麥錯題本雙向傳送門捷徑 -->
      <a href="https://b0987498500-ops.github.io/Miley-wrong-book/" target="_blank" rel="noopener noreferrer" class="cross-link-portal-btn" title="前往麥麥錯題本">
        <span class="cross-link-icon">🎯</span>
        <span class="cross-link-text">麥麥錯題本</span>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.72rem; opacity: 0.85;"></i>
      </a>

      <!-- Font Size Controller: 超有感字體放大器 -->
      <div class="font-control-group" title="字體大小調節">
        <button id="btn-font-dec" class="font-btn" aria-label="縮小字體">A-</button>
        <span id="font-scale-label" class="font-scale-display">100%</span>
        <button id="btn-font-inc" class="font-btn" aria-label="放大字體">A+</button>
      </div>

      <!-- Theme Selector -->
      <div class="theme-selector" title="外觀主題切換">
        <button class="theme-btn active" data-theme="light" title="清新亮色"><i class="fa-solid fa-sun"></i></button>
        <button class="theme-btn" data-theme="eyecare" title="溫和護眼"><i class="fa-solid fa-feather-pointed"></i></button>
        <button class="theme-btn" data-theme="dark" title="沉浸深色"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="main-container">
    <!-- Hero & Search Section with Cute Vector Line Art Mascot -->
    <header class="hero-banner">
      <div class="hero-content-wrapper">
        <div class="hero-text-side">
          <div class="hero-cute-badge">
            <img src="images/illustrations/sticker_pencil.png" alt="魔法鉛筆" class="hero-badge-sticker">
            <span>Miley 專屬智慧手帳 · 影片重點筆記庫</span>
          </div>
          <h2>隨看隨記 · 智能筆記精華</h2>
          <p class="hero-desc">觀看教學影片截圖傳送，AI 自動提煉觀念、翻牌背誦大表與口訣，<span class="text-nowrap">免抄寫無負擔！</span></p>
          
          <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="search-input" class="search-input" placeholder="搜尋核心觀念、口訣、動物、植物或章節關鍵字..." autocomplete="off">
          </div>
        </div>

        <div class="hero-mascot-side">
          <div class="hero-mascot-frame">
            <img src="images/illustrations/miley_mascot.png" alt="麥麥吉祥物" class="hero-mascot-img">
            <img src="images/illustrations/sticker_book.png" alt="書本貼紙" class="mascot-float-sticker sticker-float-book">
            <img src="images/illustrations/sticker_star.png" alt="星星獎章" class="mascot-float-sticker sticker-float-star">
          </div>
        </div>
      </div>
    </header>

    <!-- Notebook Selector Deck (兩本手帳筆記本：複習 1~4 冊 vs. 進度 5~6 冊) -->
    <section class="notebook-shelf-container" aria-label="學習手帳筆記本選擇">
      <div class="notebook-shelf-header">
        <div class="shelf-pill-tag">
          <i class="fa-solid fa-book-bookmark"></i>
          <span>第一步：選擇學習手帳</span>
        </div>
        <h3 class="shelf-title">先選好想看的筆記本，再挑選學科重點 📖</h3>
        <p class="shelf-subtitle">會考 1～4 冊全觀念複習 · 國三 5～6 冊學期最新進度</p>
      </div>

      <div class="notebook-cards-grid">
        <!-- 筆記本 1: 複習手帳 (第 1～4 冊) -->
        <button type="button" class="notebook-card active nb-review-card" data-stage="review" id="nb-card-review" aria-pressed="true">
          <div class="nb-leather-band"></div>
          <div class="nb-ribbon-bookmark">
            <span class="ribbon-tail"></span>
            <span class="ribbon-text">第 1～4 冊</span>
          </div>
          <div class="nb-card-inner">
            <div class="nb-cover-icon-wrap">
              <span class="nb-cover-emoji">📘</span>
              <div class="nb-cover-sparkle">✨</div>
            </div>
            <div class="nb-card-details">
              <div class="nb-badge-row">
                <span class="nb-type-pill pill-review">會考總複習</span>
                <span class="nb-count-pill" id="badge-review-total">4 篇重點</span>
              </div>
              <h4 class="nb-book-title">📗 複習 筆記本</h4>
              <p class="nb-book-desc">第 1～4 冊 · 國中會考觀念總複習</p>
            </div>
            <div class="nb-active-stamp">
              <i class="fa-solid fa-circle-check"></i>
              <span>正在翻閱</span>
            </div>
          </div>
        </button>

        <!-- 筆記本 2: 進度手帳 (第 5～6 冊) -->
        <button type="button" class="notebook-card nb-progress-card" data-stage="progress" id="nb-card-progress" aria-pressed="false">
          <div class="nb-leather-band"></div>
          <div class="nb-ribbon-bookmark progress-ribbon">
            <span class="ribbon-tail"></span>
            <span class="ribbon-text">第 5～6 冊</span>
          </div>
          <div class="nb-card-inner">
            <div class="nb-cover-icon-wrap">
              <span class="nb-cover-emoji">📙</span>
              <div class="nb-cover-sparkle">🚀</div>
            </div>
            <div class="nb-card-details">
              <div class="nb-badge-row">
                <span class="nb-type-pill pill-progress">學期新進度</span>
                <span class="nb-count-pill" id="badge-progress-total">2 篇重點</span>
              </div>
              <h4 class="nb-book-title">📘 進度 筆記本</h4>
              <p class="nb-book-desc">第 5 冊開始 · 國三學期最新課堂進度</p>
            </div>
            <div class="nb-active-stamp">
              <i class="fa-solid fa-circle-check"></i>
              <span>正在翻閱</span>
            </div>
          </div>
        </button>
      </div>
    </section>

    <!-- Subject Tabs with Cute Hand-Drawn Wooden Plank Buttons (第二步：挑選學科) -->
    <div class="tabs-scroll-container">
      <div class="subject-step-bar">
        <span class="subject-step-tag"><i class="fa-solid fa-arrow-down-long"></i> 第二步：挑選學科重點</span>
        <span class="current-stage-indicator" id="current-stage-indicator">目前手帳：<b>📘 第 1～4 冊 複習手帳</b></span>
      </div>
      <div class="subject-tabs">
        <button class="subject-tab-btn active tab-btn-all" data-subject="all">
          <img src="images/illustrations/tab_all.png" alt="全部" class="tab-cute-icon">
          <span>全部重點</span>
          <span class="badge-count">4</span>
        </button>
        <button class="subject-tab-btn tab-btn-science" data-subject="science">
          <img src="images/illustrations/tab_science.png" alt="自然" class="tab-cute-icon">
          <span>自然</span>
          <span class="badge-count">4</span>
        </button>
        <button class="subject-tab-btn tab-btn-math" data-subject="math">
          <img src="images/illustrations/tab_math.png" alt="數學" class="tab-cute-icon">
          <span>數學</span>
          <span class="badge-count">0</span>
        </button>
        <button class="subject-tab-btn tab-btn-chinese" data-subject="chinese">
          <img src="images/illustrations/tab_chinese.png" alt="國文" class="tab-cute-icon">
          <span>國文</span>
          <span class="badge-count">0</span>
        </button>
        <button class="subject-tab-btn tab-btn-social" data-subject="social">
          <img src="images/illustrations/tab_social.png" alt="社會" class="tab-cute-icon">
          <span>社會</span>
          <span class="badge-count">1</span>
        </button>
        <button class="subject-tab-btn tab-btn-english" data-subject="english">
          <img src="images/illustrations/tab_english.png" alt="英文" class="tab-cute-icon">
          <span>英文</span>
          <span class="badge-count">0</span>
        </button>
      </div>
    </div>



    <!-- Dynamic Notes Container (Book Mode / List Mode) -->
    <section id="notes-container" class="notes-content-area">
      <!-- Injected by app.js -->
    </section>
  </main>

  <!-- Cute Floating Back-to-Top Button (不管在哪裡都能一鍵秒回頂端) -->
  <button id="btn-back-to-top" class="back-to-top-btn" onclick="scrollToTop()" aria-label="回到最頂端" title="飛回頂端 🚀">
    <div class="btt-inner">
      <span class="btt-sprout" aria-hidden="true">🌱</span>
      <div class="btt-avatar-box">
        <img src="images/illustrations/miley_mascot.png" alt="麥麥" class="btt-avatar-img">
        <span class="btt-sparkle" aria-hidden="true">✨</span>
      </div>
      <div class="btt-arrow-icon" aria-hidden="true">
        <i class="fa-solid fa-chevron-up"></i>
      </div>
      <span class="btt-label">回頂端</span>
    </div>
    <div class="btt-tooltip" aria-hidden="true">
      <span>咻～回到最上方！🚀</span>
    </div>
  </button>

  <!-- High Definition Image Lightbox Modal -->
  <div id="image-lightbox" class="image-lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-dialog" onclick="event.stopPropagation()">
      <button class="lightbox-close-btn" onclick="closeLightbox()" title="關閉放大視窗 (Esc)">&times;</button>
      <img id="lightbox-img" src="" alt="教學重點高清大圖">
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>

  <!-- Scripts with Cache Buster -->
  <script src="notes_data.js?v=2.3.0"></script>
  <script src="app.js?v=2.3.0"></script>
</body>
</html>
